name: Deploy to GitHub Pages

# Builds the static export and publishes it to the gh-pages branch.
# GitHub Pages serves the gh-pages branch at https://adek1252ai.github.io/Bingo/
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # GitHub Pages runs Jekyll by default, which drops directories that
      # start with an underscore (e.g. _next/). .nojekyll disables that.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: 'Deploy ${{ github.sha }} to gh-pages'
